# vm-run.conf -- o que scripts/vm-run.sh (ao lado) roda no espelho da VM de teste (tibiatest). Este
# arquivo e' SOURCED aqui (so' pra ler PROJ/EXCLUDES/LOCKFILES/TIERS_ALL/QUICK_RE) e la' (as receitas):
# ele so' DEFINE, nunca executa. Receitas rodam com cwd = raiz do espelho, TMPDIR=/var/tmp/leva-ou-nao,
# sob memcap. Teste NUNCA roda no PC do dono (2026-09-27): sempre por aqui.
#
# Gates de ENTREGA (PR app-de-verdade -> main):
#   scripts/vm-run.sh            = test + check + api + e2e + android (rodada inteira, entra na fila da VM)
#   scripts/vm-run.sh test       = npm test (node --test, arquivos em paralelo)          segundos
#   scripts/vm-run.sh check      = node --check em www/*.js, api/ e tests/ + JS inline do index.html
#   scripts/vm-run.sh api        = wrangler dev LOCAL (sem conta Cloudflare) + as 3 rotas por HTTP
#   scripts/vm-run.sh e2e        = Chromium headless nos botoes (OFF mockado) + Lighthouse + instalavel  segundos
#   scripts/vm-run.sh android    = cap sync + assembleRelease/bundleRelease com chave de TESTE (minutos, fila)
#   scripts/vm-run.sh quick      = so' os gates ligados ao diff vs origin/main (sem android)
PROJ=leva-ou-nao
# .git NAO viaja (historico pode guardar segredo apagado). Chave de assinatura, .env e .dev.vars
# (segredos do wrangler local) nunca viajam. build/.gradle/.wrangler sao gerados LA' e ficam no espelho.
EXCLUDES=(.git node_modules .vm-run .wrangler .gradle build .cxx '*.apk' '*.aab' local.properties
	.env '.env.*' .dev.vars '*.jks' '*.keystore' '*.pem' '*.p12' '*.pfx' /.claude/worktrees /ios/App/Pods)
INCLUDES=()
LOCKFILES=(package-lock.json api/package-lock.json tests/e2e/package-lock.json scripts/vm-run.conf)
TIERS_ALL="test check api e2e android"
QUICK_RE='\.(js|mjs|json|html|sql|toml)$'
HOME_FILES=()
FERR=/root/.cache/leva-ou-nao-ferramentas   # JDK + Android SDK: no HOME da VM, nunca no sistema

ambiente() { # DENTRO de cada receita (e do `-- cmd`)
	export PATH="$PWD/node_modules/.bin:$FERR/jdk/bin:$FERR/android-sdk/cmdline-tools/latest/bin:$FERR/android-sdk/platform-tools:/root/bin:/root/.local/bin:$PATH"
	export npm_config_cache=/root/.npm GRADLE_USER_HOME=/root/.gradle WRANGLER_SEND_METRICS=false \
		JAVA_HOME="$FERR/jdk" ANDROID_HOME="$FERR/android-sdk" ANDROID_SDK_ROOT="$FERR/android-sdk"
	{ command -v node >/dev/null && command -v npm >/dev/null; } ||
		{ DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nodejs npm >/dev/null 2>&1; } ||
		{ echo "!! node/npm ausentes e nao instalaram"; return 1; }
	local maior; maior=$(node -p 'process.versions.node.split(".")[0]')
	[ "$maior" -ge 22 ] || { echo "!! node $maior < 22 (o CI usa 22; wrangler 4 pede >= 20)"; return 1; }
}
deps() { # uma vez por lockfile novo: node_modules da raiz (Capacitor), da API (wrangler) e do e2e (playwright-core+lighthouse)
	ambiente && npm ci --no-audit --no-fund --loglevel=error &&
		npm ci --prefix api --no-audit --no-fund --loglevel=error &&
		npm ci --prefix tests/e2e --no-audit --no-fund --loglevel=error
}

tier_test() { ambiente && npm test --silent; }   # node --test ja' roda os arquivos em paralelo

tier_check() { # sintaxe de todo JS proprio (www/lib/ = ZXing de terceiro, fora) + o <script> inline do index.html
	ambiente || return
	local fs; mapfile -t fs < <(ls www/*.js api/src/*.js api/scripts/*.mjs tests/*.mjs tests/e2e/*.mjs 2>/dev/null)
	printf '%s\0' "${fs[@]}" | xargs -0 -n1 -P "$(nproc)" sh -c 'node --check "$0" || { echo "!! node --check: $0"; exit 1; }' ||
		return 1
	echo ">> node --check: ${#fs[@]} arquivos OK"
	node -e '
const fs = require("fs"), vm = require("vm");
const h = fs.readFileSync("www/index.html", "utf8");
let n = 0;
for (const m of h.matchAll(/<script(?![^>]*\bsrc=)([^>]*)>([\s\S]*?)<\/script>/g)) {
  if (/type=["\x27]module/.test(m[1])) { console.log("!! <script type=module> inline: checar a mao"); process.exit(1); }
  const linha = h.slice(0, m.index).split("\n").length;
  new vm.Script(m[2], { filename: "www/index.html", lineOffset: linha - 1 });
  n++;
}
console.log(">> index.html: " + n + " <script> inline OK");'
}

tier_api() { ambiente && node api/scripts/fumaca-local.mjs; }   # sobe wrangler dev local e bate nas rotas

tier_e2e() { # Chromium headless de verdade (tests/e2e): smoke dos botoes com OFF mockado + Lighthouse + instalavel.
	ambiente || return
	export E2E_OUT=$PWD/.vm-run/e2e   # .vm-run nao viaja no rsync => relatorio/prints sobrevivem a' rodada (scp pra ver)
	rm -rf "$E2E_OUT" && mkdir -p "$E2E_OUT" || return
	# playwright-core 1.63.0 = chromium-1243 em $PLAYWRIGHT_BROWSERS_PATH (HOME da VM, sem root); ja' la' = no-op.
	node tests/e2e/node_modules/playwright-core/cli.js install chromium chromium-headless-shell >/dev/null ||
		{ echo "!! Chromium do playwright nao instalou em ${PLAYWRIGHT_BROWSERS_PATH:-?}"; return 1; }
	(cd tests/e2e && node --test --test-concurrency=2 ./*.test.mjs) || return
	echo ">> e2e OK -- relatorio Lighthouse + prints em $E2E_OUT"
}

_jdk_sdk() { # JDK 21 Temurin (o mesmo do CI) + Android SDK em $FERR. Idempotente: 2a rodada = segundos.
	mkdir -p "$FERR" || return
	if ! "$FERR/jdk/bin/java" -version 2>&1 | grep -q 'version "21\.'; then
		echo ">> baixando JDK 21 (Temurin) pra $FERR/jdk"
		rm -rf "$FERR/jdk" "$FERR/jdk.tmp" && mkdir -p "$FERR/jdk.tmp" &&
			curl -fsSL "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse" |
			tar -xz -C "$FERR/jdk.tmp" --strip-components=1 && mv "$FERR/jdk.tmp" "$FERR/jdk" ||
			{ echo "!! JDK 21 nao baixou"; return 1; }
	fi
	local sdk=$FERR/android-sdk
	if [ ! -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
		echo ">> baixando Android commandline-tools pra $sdk"
		rm -rf "$sdk/cmdline-tools" && mkdir -p "$sdk/cmdline-tools" &&
			curl -fsSL -o "$TMPDIR/clt.zip" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip &&
			python3 -m zipfile -e "$TMPDIR/clt.zip" "$sdk/cmdline-tools/" && mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest" &&
			chmod +x "$sdk/cmdline-tools/latest/bin/"* || { echo "!! commandline-tools nao baixou"; return 1; }
	fi
	# o que o build pede: variables.gradle (compileSdk 36) + build-tools do AGP 8.13 + platform-tools
	if [ ! -d "$sdk/platforms/android-36" ] || [ ! -d "$sdk/build-tools/36.0.0" ]; then
		yes 2>/dev/null | sdkmanager --sdk_root="$sdk" --licenses >/dev/null 2>&1
		sdkmanager --sdk_root="$sdk" "platforms;android-36" "build-tools;36.0.0" "platform-tools" 2>&1 | grep -v '^\[' | tail -3
		[ -d "$sdk/platforms/android-36" ] || { echo "!! platforms;android-36 nao instalou"; return 1; }
	fi
}
tier_android() { # APK+AAB release assinados com chave de TESTE gerada na hora (as MESMAS env do android.yml)
	ambiente && _jdk_sdk || return
	npx cap sync android || return
	local ks=$TMPDIR/leva-teste.keystore rc
	rm -f "$ks"
	keytool -genkeypair -noprompt -keystore "$ks" -storetype PKCS12 -storepass teste-vm -keypass teste-vm \
		-alias teste -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Chave de teste vm-run, O=leva-ou-nao" >/dev/null || return
	(cd android && chmod +x gradlew &&
		LEVA_KEYSTORE_PATH=$ks LEVA_KEYSTORE_PASSWORD=teste-vm LEVA_KEY_ALIAS=teste LEVA_KEY_PASSWORD=teste-vm \
			./gradlew assembleRelease bundleRelease --no-daemon --console=plain -q)
	rc=$?
	rm -f "$ks"
	[ $rc -eq 0 ] || return $rc
	local apk=android/app/build/outputs/apk/release/app-release.apk aab=android/app/build/outputs/bundle/release/app-release.aab
	[ -s "$apk" ] && [ -s "$aab" ] || { echo "!! APK/AAB nao saiu ($apk, $aab)"; return 1; }
	"$FERR/android-sdk/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | grep -m1 'certificate DN' || { echo "!! APK sem assinatura valida"; return 1; }
	echo ">> APK $(du -h "$apk" | cut -f1) + AAB $(du -h "$aab" | cut -f1) assinados (chave de teste, descartada)"
}

fila_tier() { # <tier> [args] -> rc 0 = fila EXCLUSIVA da VM. So' o android (build de minutos, 8 CPU) espera;
	# test/check/api sao segundos e o wrangler sobe em porta LIVRE, entao passam direto.
	case "$1" in android) return 0 ;; *) return 1 ;; esac
}
tier_quick() { # so' os gates ligados ao diff local (VM_CHANGED, 1 por linha); android fica de fora (minutos)
	local f t=' '
	while IFS= read -r f; do
		case "$f" in
		www/lib/*) ;;
		www/rotulo.js) t="$t test check api e2e " ;;
		tests/e2e/*) t="$t check e2e " ;;
		www/*.js) t="$t test check e2e " ;;
		tests/*) t="$t test check " ;;
		www/*) t="$t check e2e " ;;
		api/*) t="$t check api " ;;
		esac
	done <"${VM_CHANGED:?}"
	local g feitos=' '
	for g in test check api e2e; do
		case "$t" in *" $g "*) case "$feitos" in *" $g "*) ;; *) echo ">> quick: $g"; tier_$g || return; feitos="$feitos$g " ;; esac ;; esac
	done
	[ "$feitos" != ' ' ] || echo ">> quick: nenhum gate ligado ao diff ($(wc -l <"$VM_CHANGED") arquivos)"
}
