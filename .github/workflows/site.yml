name: Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["www/**", ".github/workflows/site.yml"]
  workflow_dispatch:

# nada por padrão; cada job pede só o que usa
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read # ler o repo
      pages: write # publicar no GitHub Pages
      id-token: write # deploy-pages prova que o deploy veio deste repo
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
