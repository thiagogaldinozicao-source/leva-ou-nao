name: APK Android

on:
  push:
    branches: [main]
    paths: ["www/**", "android/**", "package.json", "package-lock.json", "capacitor.config.json", ".github/workflows/android.yml"]
  workflow_dispatch:

# nada por padrão; cada job pede só o que usa
permissions: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a Release e anexar APK/AAB
    steps:
      # Sem a chave não publica nada: um APK com chave errada/pública deixa qualquer um soltar "update" falso.
      - name: Conferir chave de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          faltam=""
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!s}" ] || faltam="$faltam $s"
          done
          if [ -n "$faltam" ]; then
            echo "::error title=Falta a chave de assinatura::Nada foi publicado. Cadastre em Settings > Secrets and variables > Actions:$faltam. Passo a passo: docs/CHECKLIST-LANCAMENTO.md, seção 'Chave de assinatura (Thiago)'."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Copiar app pro Android
        run: npx cap sync android

      - name: Montar chave (arquivo temporário)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/leva-ou-nao.keystore"

      - name: Gerar APK e AAB assinados
        working-directory: android
        env:
          LEVA_KEYSTORE_PATH: ${{ runner.temp }}/leva-ou-nao.keystore
          LEVA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LEVA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LEVA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Apagar chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/leva-ou-nao.keystore"

      - name: Renomear APK e AAB
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk leva-ou-nao-v${{ github.run_number }}.apk
          cp android/app/build/outputs/bundle/release/app-release.aab leva-ou-nao-v${{ github.run_number }}.aab

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leva-ou-nao-apk
          path: |
            leva-ou-nao-v${{ github.run_number }}.apk
            leva-ou-nao-v${{ github.run_number }}.aab

      - name: Publicar em Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Leva ou não v0.1.${{ github.run_number }}
          body: |
            Gerado automaticamente e assinado com a chave oficial do app.
            - Celular Android: baixe o arquivo .apk abaixo e instale.
            - Google Play: o arquivo .aab é o que vai pra loja.
            Tinha instalado uma versão de teste antiga? Desinstale uma vez antes de instalar esta.
          files: |
            leva-ou-nao-v${{ github.run_number }}.apk
            leva-ou-nao-v${{ github.run_number }}.aab
