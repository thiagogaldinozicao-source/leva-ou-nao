name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Copiar app pro Android
        run: npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk leva-ou-nao-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: leva-ou-nao-apk
          path: leva-ou-nao-v${{ github.run_number }}.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Leva ou não v0.1.${{ github.run_number }}
          body: APK gerado automaticamente. Baixe o arquivo .apk abaixo no celular Android e instale.
          files: leva-ou-nao-v${{ github.run_number }}.apk
